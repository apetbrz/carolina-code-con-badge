[package]
name = "esp32-s3-carolina-code-con-2026-badge-conway"
version = "0.7.0"
authors = ["Arthur Petroff <apetbrz@gmail.com>", "Juraj Michálek <juraj.michalek@espressif.com>"]
edition = "2024"
license = "MIT OR Apache-2.0"

[dependencies]
esp-hal = { version = "1.1.0", features = ["esp32s3", "unstable"] }
esp-backtrace = { version = "0.19.0", features = [
    "panic-handler",
    "println"
] }
esp-println = { version = "0.17.0", features = [ "log-04" ] }
log = { version = "0.4.29" }

embedded-graphics = "0.8.2"
embedded-hal = "1.0.0"
mipidsi = "0.10.0"
embedded-graphics-framebuf = { version = "0.3.0", git = "https://github.com/georgik/embedded-graphics-framebuf.git", branch = "feature/embedded-graphics-0.8" }
heapless = "0.9.2"
embedded-hal-bus = "0.3.0"

esp-bootloader-esp-idf = { version = "0.5.0", features = ["esp32s3"] }

[features]
default = [ "esp-hal/esp32s3", "esp-backtrace/esp32s3", "esp-println/esp32s3" ]
